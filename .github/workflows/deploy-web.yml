name: Publish web prototype

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'   # weekly refresh of the places snapshot (Mondays)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Navigation math tests
        working-directory: packages/core
        run: node --experimental-strip-types --test test/nav.test.ts
      - name: Install
        working-directory: apps/web-prototype
        run: npm ci
      - name: Download places snapshot (OpenStreetMap)
        working-directory: apps/web-prototype
        run: node scripts/fetch-places.mjs
      - name: Build
        working-directory: apps/web-prototype
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web-prototype/dist

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
